<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>92Blue — Payment</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Roboto,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#cbcfd5;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:412px;background:#f2f3f4;position:relative;min-height:100vh;padding-bottom:30px;overflow:hidden}
.top{background:linear-gradient(180deg,#2563eb 0%,#1d4ed8 100%);padding:18px 18px 70px;border-radius:0 0 30px 30px}
.header{display:flex;justify-content:space-between;align-items:center;color:#fff}
.header .back{width:38px;height:38px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.header .title{font-weight:800;font-size:16px}
.header .secure{font-size:10px;font-weight:700;background:rgba(255,255,255,.15);padding:5px 12px;border-radius:20px;display:flex;align-items:center;gap:5px}
.hero{margin-top:24px;text-align:center;color:#fff}
.hero h1{font-size:22px;font-weight:900;margin-bottom:4px}
.hero p{font-size:12px;opacity:.85}
.amount-card{background:#fff;margin:-45px 16px 16px;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.08);position:relative;z-index:2}
.section-title{font-size:11px;font-weight:900;text-transform:uppercase;color:#94a3b8;letter-spacing:1px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title span.num{width:22px;height:22px;background:#2563eb;color:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px}
.amt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.amt-btn{padding:12px 4px;background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;font-weight:800;font-size:13px;color:#475569;cursor:pointer;transition:all .15s;text-align:center}
.amt-btn:active{transform:scale(.95)}
.amt-btn.selected{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border-color:#2563eb;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.amt-input{display:flex;align-items:center;background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;padding:12px 16px;margin-top:10px}
.amt-input span{font-size:20px;font-weight:900;color:#2563eb;margin-right:8px}
.amt-input input{flex:1;background:transparent;border:none;outline:none;font-size:22px;font-weight:800;color:#0f172a}
.amt-input input::placeholder{color:#cbd5e1}
.qr-section{display:none;margin-top:20px;padding-top:20px;border-top:2px dashed #e2e8f0;animation:fadeIn .3s}
.qr-section.show{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.timer-box{background:linear-gradient(135deg,#fef3c7,#fde68a);border:2px solid #fbbf24;border-radius:14px;padding:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.timer-box .t-left{display:flex;align-items:center;gap:10px}
.timer-box .t-icon{width:36px;height:36px;background:#f59e0b;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.timer-box .t-info p{font-size:10px;font-weight:800;color:#92400e;text-transform:uppercase;letter-spacing:.5px}
.timer-box .t-info h3{font-size:22px;font-weight:900;color:#78350f;margin-top:2px;font-family:monospace}
.qr-display{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:2px solid #10b981;border-radius:16px;padding:20px;text-align:center;margin-bottom:16px;position:relative}
.qr-display::before{content:'';position:absolute;top:8px;left:8px;right:8px;bottom:8px;border:2px dashed #10b981;border-radius:12px;pointer-events:none;opacity:.3}
.qr-header{font-size:10px;font-weight:900;color:#065f46;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;position:relative}
.qr-image{width:200px;height:200px;margin:0 auto;background:#fff;border-radius:12px;padding:8px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.qr-image img{width:100%;height:100%;object-fit:contain;border-radius:8px}
.qr-amount{font-size:32px;font-weight:900;color:#065f46;margin-top:14px;position:relative}
.qr-amount small{font-size:14px;font-weight:700;color:#059669}
.qr-note{font-size:11px;color:#047857;margin-top:6px;font-weight:600;position:relative}
.qr-loading{padding:40px 0;color:#64748b;font-size:13px;font-weight:600}
.wallet-input{margin-top:16px}
.wallet-input label{font-size:11px;font-weight:800;color:#475569;text-transform:uppercase;display:block;margin-bottom:8px;letter-spacing:.5px}
.wallet-input input{width:100%;padding:14px;background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;font-weight:800;text-align:center;letter-spacing:2px;outline:none}
.wallet-input input:focus{border-color:#2563eb;background:#fff}
.wallet-input p{font-size:10px;color:#94a3b8;margin-top:6px;text-align:center;font-style:italic}
.submit-btn{width:100%;padding:16px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:900;margin-top:16px;cursor:pointer;box-shadow:0 6px 16px rgba(16,185,129,.3);transition:all .15s}
.submit-btn:active{transform:scale(.97)}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}
.cancel-btn{width:100%;padding:14px;background:#fff;color:#64748b;border:1px solid #e2e8f0;border-radius:14px;font-size:14px;font-weight:800;margin-top:10px;cursor:pointer}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.95);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.loading-screen{position:fixed;inset:0;background:#f2f3f4;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:9998}
.spinner{width:44px;height:44px;border:4px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
.loading-screen p{font-size:13px;font-weight:700;color:#475569}
</style>
</head>
<body>

<div id="loadingScreen" class="loading-screen">
  <div class="spinner"></div>
  <p>Loading...</p>
</div>

<div class="app">
  <div class="top">
    <div class="header">
      <div class="back" onclick="location.href='../index.html'">
        <i class="fa-solid fa-arrow-left"></i>
      </div>
      <div class="title">Secure Payment</div>
      <div class="secure">
        <i class="fa-solid fa-shield-halved"></i> SECURE
      </div>
    </div>
    <div class="hero">
      <h1>Complete Payment</h1>
      <p>Choose amount & scan QR to pay</p>
    </div>
  </div>

  <div class="amount-card">
    <div class="section-title"><span class="num">1</span> Select Amount</div>
    <div class="amt-grid" id="amtGrid"></div>
    <div class="amt-input">
      <span>Rs</span>
      <input type="number" id="amtInput" placeholder="Custom amount" min="1">
    </div>

    <div id="qrSection" class="qr-section">
      <div class="section-title"><span class="num">2</span> Scan & Pay</div>

      <div class="timer-box">
        <div class="t-left">
          <div class="t-icon"><i class="fa-solid fa-hourglass-half"></i></div>
          <div class="t-info">
            <p>Time Remaining</p>
            <h3 id="timerDisplay">10:00</h3>
          </div>
        </div>
      </div>

      <div class="qr-display" id="qrDisplay">
        <div class="qr-header">📱 SCAN WITH ANY PAYMENT APP</div>
        <div id="qrContent">
          <div class="qr-loading">Loading QR...</div>
        </div>
      </div>

      <div class="wallet-input">
        <div class="section-title"><span class="num">3</span> Your Wallet Number</div>
        <input type="tel" id="userWallet" placeholder="03XXXXXXXXX" maxlength="11" inputmode="numeric">
        <p>The number you'll send payment FROM</p>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitPayment()">
        <i class="fa-solid fa-check-circle mr-2"></i>I'VE SENT THE PAYMENT
      </button>
      <button class="cancel-btn" onclick="cancelPayment()">
        Cancel
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDAjCe1sI0wEW737ZbnTDGietZeSkHDtmw",
  authDomain: "sellershop-bda2e.firebaseapp.com",
  databaseURL: "https://sellershop-bda2e-default-rtdb.firebaseio.com",
  projectId: "sellershop-bda2e",
  storageBucket: "sellershop-bda2e.firebasestorage.app",
  messagingSenderId: "655043460897",
  appId: "1:655043460897:web:9285631e2752a80c83c860"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const FB_TS = firebase.database.ServerValue.TIMESTAMP;

const AMOUNTS = [300, 500, 1000, 3000, 5000, 10000];
const TIMER_MINUTES = 10;

let currentUser = null;
let userData = null;
let selectedAmount = 0;
let selectedQrConfig = null;
let requestId = null;
let expiresAt = null;
let timerInterval = null;
let qrConfigs = {};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg) {
  const t = $("toast");
  t.innerText = msg;
  t.className = "toast show";
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = "toast"; }, 2500);
}

function renderAmountGrid() {
  $("amtGrid").innerHTML = AMOUNTS.map(a => 
    `<button class="amt-btn" data-amt="${a}" onclick="selectAmount(${a})">Rs ${a}</button>`
  ).join("");
}

function selectAmount(amt) {
  selectedAmount = amt;
  $("amtInput").value = amt;
  document.querySelectorAll(".amt-btn").forEach(b => {
    b.classList.toggle("selected", Number(b.dataset.amt) === amt);
  });
  checkAndShowQr();
}

async function loadQrConfigs() {
  try {
    const snap = await db.ref("merchant_qr_config").once("value");
    qrConfigs = snap.val() || {};
  } catch (e) {
    qrConfigs = {};
  }
}

function getQrForAmount(amt) {
  const amtKey = "amt_" + amt;
  if (qrConfigs[amtKey] && qrConfigs[amtKey].active !== false && qrConfigs[amtKey].imageUrl) {
    return qrConfigs[amtKey];
  }
  if (qrConfigs.default && qrConfigs.default.active !== false && qrConfigs.default.imageUrl) {
    return qrConfigs.default;
  }
  return null;
}

function checkAndShowQr() {
  const amt = Number($("amtInput").value) || selectedAmount;
  if (!amt || amt < 1) {
    $("qrSection").classList.remove("show");
    return;
  }
  if (amt < 1 || amt > 500000) {
    $("qrSection").classList.remove("show");
    return;
  }

  selectedAmount = amt;
  selectedQrConfig = getQrForAmount(amt);

  if (!selectedQrConfig) {
    $("qrSection").classList.add("show");
    $("qrContent").innerHTML = `<div class="qr-loading" style="color:#dc2626">❌ No QR configured for this amount<br><small style="font-size:11px">Contact support</small></div>`;
    return;
  }

  $("qrSection").classList.add("show");
  $("qrContent").innerHTML = `
    <div class="qr-image">
      <img src="${esc(selectedQrConfig.imageUrl)}" alt="QR Code">
    </div>
    <div class="qr-amount"><small>Rs</small> ${amt.toLocaleString()}</div>
    <div class="qr-note">
      ${selectedQrConfig.walletName ? esc(selectedQrConfig.walletName) : ""}
    </div>
  `;

  // Start timer if not started
  if (!expiresAt) {
    startTimer();
  }
}

function startTimer() {
  expiresAt = Date.now() + (TIMER_MINUTES * 60 * 1000);
  updateTimerDisplay();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimerDisplay, 1000);
}

function updateTimerDisplay() {
  const left = expiresAt - Date.now();
  if (left <= 0) {
    clearInterval(timerInterval);
    $("timerDisplay").innerText = "00:00";
    $("timerDisplay").style.color = "#dc2626";
    return;
  }
  const m = Math.floor(left / 60000);
  const s = Math.floor((left % 60000) / 1000);
  $("timerDisplay").innerText = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

async function submitPayment() {
  if (!selectedAmount || selectedAmount < 1) {
    return toast("Please select amount");
  }
  const wallet = $("userWallet").value.trim();
  if (!wallet || wallet.length < 10) {
    return toast("Enter valid wallet number");
  }
  if (!/^\d+$/.test(wallet)) {
    return toast("Only digits allowed");
  }
  if (!selectedQrConfig) {
    return toast("QR not configured. Contact support.");
  }

  const btn = $("submitBtn");
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Submitting...';

  try {
    const reqRef = db.ref("deposit_requests").push();
    requestId = reqRef.key;
    const now = Date.now();
    
    await reqRef.set({
      uid: currentUser.uid,
      publicUid: userData.publicUid || "",
      userName: userData.name || "",
      phone: userData.phone || "",
      amount: selectedAmount,
      method: "QR_PAYMENT",
      methodKey: "qr",
      qrConfig: selectedQrConfig,
      userWalletNumber: wallet,
      userConfirmed: true,
      userConfirmedAt: now,
      status: "pending",
      source: "merchant_qr",
      createdAt: now,
      expiresAt: expiresAt || (now + TIMER_MINUTES * 60 * 1000),
      approvedAt: null,
      rejectedAt: null,
      credited: false
    });

    toast("✅ Request sent! Waiting for approval.");
    btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i>Submitted';
    
    setTimeout(() => {
      location.href = "../index.html";
    }, 2000);
  } catch (e) {
    toast("Failed: " + e.message);
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-check-circle mr-2"></i>I\'VE SENT THE PAYMENT';
  }
}

function cancelPayment() {
  location.href = "../index.html";
}

// Live input monitoring
$("amtInput").addEventListener("input", () => {
  const v = Number($("amtInput").value) || 0;
  selectedAmount = v;
  document.querySelectorAll(".amt-btn").forEach(b => b.classList.remove("selected"));
  if (v >= 1) {
    checkAndShowQr();
  } else {
    $("qrSection").classList.remove("show");
  }
});

$("userWallet").addEventListener("input", (e) => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 11);
});

// Auth
auth.onAuthStateChanged(async (user) => {
  if (!user) { location.href = "../index.html?auth=1"; return; }
  const snap = await db.ref("users/" + user.uid).once("value");
  const data = snap.val();
  if (!data) { await auth.signOut(); location.href = "../index.html?auth=1"; return; }
  if (data.status === "banned") { alert("Account banned"); await auth.signOut(); location.href = "../index.html"; return; }
  
  currentUser = user;
  userData = data;
  
  renderAmountGrid();
  await loadQrConfigs();
  
  $("loadingScreen").style.display = "none";
});
</script>
</body>
</html>
